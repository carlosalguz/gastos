<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{color-scheme:dark;--page:#000;--bg:#09090b;--tile:#18181b;--tile2:#27272a;--line:#1f1f23;--ink:#fafafa;--mute:#a1a1aa;--dim:#71717a;--faint:#52525b;--acc:#67e8f9;--onacc:#09090b;--accbg:#0f2a30;--ing:#86efac;--gas:#fda4af;--warn:#fcd34d;--navbg:rgba(9,9,11,.94);--ov:rgba(0,0,0,.6);--sheet:#141417;--delbg:#2a1215;--selband:rgba(103,232,249,.07);--toastBg:#fafafa;--toastInk:#09090b;--toastErr:#fda4af;--heroA:#0e7490;--heroB:#0f172a;--heroInk:#a5f3fc;--heroPos:#86efac;--heroNeg:#fda4af;--sbar:#09090b}
@media (prefers-color-scheme:light){:root{color-scheme:light;--page:#e4e4e7;--bg:#f4f4f5;--tile:#ffffff;--tile2:#e4e4e7;--line:#e4e4e7;--ink:#18181b;--mute:#52525b;--dim:#71717a;--faint:#a1a1aa;--acc:#0891b2;--onacc:#ffffff;--accbg:#ecfeff;--ing:#15803d;--gas:#e11d48;--warn:#b45309;--navbg:rgba(244,244,245,.94);--ov:rgba(24,24,27,.35);--sheet:#ffffff;--delbg:#ffe4e6;--selband:rgba(8,145,178,.08);--toastBg:#18181b;--toastInk:#fafafa;--toastErr:#e11d48;--heroA:#0891b2;--heroB:#164e63;--heroInk:#cffafe;--heroPos:#bbf7d0;--heroNeg:#fecdd3;--sbar:#18181b}}
@media (prefers-color-scheme:light){.t,.cat,.seg,.chip:not(.on){box-shadow:0 1px 2px rgba(24,24,27,.06),0 0 0 1px rgba(24,24,27,.04)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif;height:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.stage{min-height:100%;display:flex;justify-content:center}
.side{display:none}
.phone{width:100%;max-width:430px;height:100vh;height:100dvh;height:var(--app-h,100dvh);background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:18px 14px calc(110px + env(safe-area-inset-bottom));scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));background:var(--navbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9.5px;letter-spacing:.12em;font-weight:600;color:var(--faint);text-transform:uppercase}
.nav button.on{color:var(--ink)}
.nav svg{width:20px;height:20px}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--tile2);color:var(--mute);font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--onacc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{background:var(--tile);border-radius:18px;padding:12px 14px}
.s2{grid-column:span 2}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em}
.mid{font-size:19px;font-weight:700;margin-top:3px}
.sub{font-size:11px;color:var(--mute);margin-top:2px}
.up{color:var(--gas)}.down{color:var(--ing)}
.seg{display:flex;background:var(--tile);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--tile2);color:var(--ink)}
.rk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.rk:first-of-type{border-top:0}
.rk .bar{grid-column:span 2;height:5px;background:var(--tile2);border-radius:3px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.rk .n{font-size:13px;font-weight:500}
.rk .p{font-size:13px;font-weight:700;text-align:right}
.rk .m{font-size:10.5px;color:var(--dim)}
.rk .a{font-size:10.5px;text-align:right}
.link{color:var(--acc);font-size:12px;font-weight:600;padding:8px 0 0}
.back{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-bottom:12px}
.mv{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.mv .d{font-size:13.5px;font-weight:500}
.mv .c{font-size:11px;color:var(--dim);margin-top:2px}
.mv .v{font-size:14px;font-weight:700}
.dayh{font-size:10.5px;letter-spacing:.1em;color:var(--dim);font-weight:600;margin:16px 0 2px}
/* cargar */
.field{border-bottom:1px solid var(--tile2);padding:14px 0 10px}
.amount{width:100%;background:none;border:0;outline:0;font-size:46px;font-weight:700;letter-spacing:-.02em;padding-top:4px}
.amount::placeholder{color:var(--faint)}
.txt{width:100%;background:none;border:0;outline:0;font-size:18px;padding-top:6px}
.txt::placeholder{color:var(--faint)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cat{background:var(--tile);border-radius:99px;padding:11px 4px;font-size:13px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
.cat.on{border-color:var(--acc);color:var(--ink);background:var(--accbg)}
.save{position:absolute;left:14px;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));height:52px;border-radius:99px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:16px;z-index:5}
.save:disabled{opacity:.35}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--toastBg);color:var(--toastInk);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;transition:transform .3s;z-index:20;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--tile);display:grid;place-items:center;color:var(--mute)}
/* sheet */
.ov{position:absolute;inset:0;background:var(--ov);z-index:30;display:flex;align-items:flex-end}
.sheet{background:var(--sheet);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
.sheet label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:12px 0 4px}
.sheet input,.sheet select{width:100%;background:var(--tile);border:1px solid var(--tile2);border-radius:12px;padding:11px 12px;outline:0}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{flex:1;height:46px;border-radius:99px;font-weight:700}
.del{background:var(--delbg);color:var(--gas)}
.ok{background:var(--acc);color:var(--onacc)}
.pb{height:8px;background:var(--tile2);border-radius:4px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;border-radius:4px}
.empty{color:var(--dim);font-size:13px;padding:20px 0;text-align:center}
.tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--tile2);color:var(--mute)}
button:disabled{opacity:.5}

.setup{padding-top:12vh}
.setup h1{font-size:26px;font-weight:800;margin:14px 0 6px}
.setup p{color:var(--mute);font-size:13.5px;line-height:1.5;margin-bottom:18px}
.setup label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:14px 0 6px}
.setup input{width:100%;background:var(--tile);border:1px solid var(--tile2);border-radius:12px;padding:13px 12px;outline:0;font-size:16px}
.setup .ok{width:100%;height:50px;border-radius:99px;font-weight:700;margin-top:22px}
.setup .err{color:var(--gas);font-size:13px;margin-top:12px;min-height:18px}
.vsel button{font-size:12px}
.yo{font-weight:500;opacity:.6;font-size:11px}
.who{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:var(--tile2);color:var(--mute);margin-right:2px}
.who-carlos{color:var(--acc)}.who-valentina{color:var(--gas)}
.mv.ro{cursor:default}
.lock{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px calc(24px + env(safe-area-inset-bottom));text-align:center}
.lock h2{font-size:22px;font-weight:800;margin:16px 0 6px}
.lock p{color:var(--mute);font-size:13.5px;margin-bottom:22px}
.lock .ok{width:100%;height:50px;border-radius:99px;font-weight:700}
.lock input{width:100%;background:var(--tile);border:1px solid var(--tile2);border-radius:12px;padding:13px 12px;outline:0;font-size:16px;margin-top:14px}
.lock .err{color:var(--gas);font-size:13px;margin-top:12px;min-height:18px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.opt .sub{line-height:1.4}
.sw{flex:none;width:52px;height:32px;border-radius:99px;background:var(--tile2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--ing)}.sw.on::after{transform:translateX(20px)}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="toast" id="toast"></div>
    <main id="main"></main>
    <div id="extra"></div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<script>
/* Alto real visible: iOS a veces informa 100dvh mayor que la pantalla en apps de inicio */
function ajustarAlto() { document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px'); }
ajustarAlto();
['resize', 'orientationchange', 'pageshow'].forEach(ev => window.addEventListener(ev, () => setTimeout(ajustarAlto, 60)));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(ajustarAlto, 60); });

/* ===== Conexión con Apps Script (con modo de prueba fuera de Apps Script) ===== */
/* Configuración guardada en este teléfono: URL de la API (Apps Script /exec) y contraseña */
const CFG_KEY = 'gastos_cfg';
function getCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { return null; } }
function setCfg(c) { try { c ? localStorage.setItem(CFG_KEY, JSON.stringify(c)) : localStorage.removeItem(CFG_KEY); } catch (e) {} }
const QS = new URLSearchParams(location.search);
const DEMO = QS.has('demo');
async function api(fn, ...args) {
  if (DEMO) { await new Promise(r => setTimeout(r, 200)); return MOCK[fn](...args); }
  const c = getCfg();
  if (!c) throw 'SIN_CONFIG';
  return callApi(c, fn, args);
}
async function callApi(c, fn, args) {
  let r;
  const body = { pin: c.pin, action: fn, args: args || [] };
  if (ALL && ALL.yo) body.perfil = ALL.yo; // la API rechaza escrituras en un perfil ajeno
  try {
    r = await fetch(c.url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch (e) { throw 'Sin conexión con el Sheet. Revisa tu internet.'; }
  let j;
  try { j = await r.json(); } catch (e) { throw 'Respuesta inesperada. Revisa la URL y que la implementación tenga acceso "Cualquier persona".'; }
  if (!j.ok) throw j.error || 'Error desconocido';
  return j.data;
}
const MOCK = (() => {
  // Solo para pruebas: ?demo (perfil Carlos) o ?demo=valentina
  const yo = QS.get('demo') === 'valentina' ? 'valentina' : 'carlos';
  const mk = raw => raw.map((r, i) => ({ id: i + 1, mes: r[0], tipo: r[1], fecha: r[2], valor: r[3], desc: r[4], cat: r[5] }));
  const P = {
    carlos: { nombre: 'Carlos', movs: mk([['2026-09','G','2026-09-15',366804,'Udara','Administración'],['2026-09','G','2026-09-15',71128,'Acuerdo','TC Nu'],['2026-09','G','2026-09-17',700000,'','Otros'],['2026-09','G','2026-09-19',138300,'Crepes','Otros'],['2026-09','G','2026-09-21',41900,'Youtube','Youtube'],['2026-09','G','2026-09-25',646230,'Varios','Otros'],['2026-09','I','2026-09-15',2990000,'Sueldo 15','Sueldo'],['2026-09','I','2026-09-30',2990000,'Sueldo fin de mes','Sueldo'],['2026-10','G','2026-09-30',2630346,'Udara','Arriendo'],['2026-10','G','2026-09-30',20700,'Virgin','Otros'],['2026-10','G','2026-09-30',133800,'DTV','DTV'],['2026-10','G','2026-10-01',100000,'Regalo amigo secreto','Otros'],['2026-10','G','2026-10-01',14989,'Uber','Otros']]),
      catsG: ['Arriendo','Administración','Luz','Agua','Claude','Apple one','Movistar','Capcut','TC Fal','TC Nu','Netflix','Youtube','Fondo','Mercado','Complementaria','Somos','DTV','Lavandería','Gasolina','Otros'], catsI: ['Sueldo','Freelance','Otros ingresos'], saldo0: { valor: 5631, mes: '2026-09' },
      prev: {'Arriendo':2630346,'Administración':366804,'Luz':100000,'Agua':100000,'Claude':70000,'Apple one':87000,'Movistar':110000,'Capcut':60000,'TC Fal':825503,'TC Nu':85000,'Netflix':30000,'Youtube':48000,'Fondo':240000,'Mercado':1000000,'Complementaria':350000,'Somos':150000,'DTV':140000,'Lavandería':200000,'Gasolina':400000} },
    valentina: { nombre: 'Valentina', movs: mk([['2026-10','G','2026-10-05',1700000,'Cuota','Cr. Hip 1604'],['2026-10','G','2026-10-08',304815,'','Prepagada'],['2026-10','G','2026-10-10',86000,'Gasolina','Moto'],['2026-10','G','2026-10-12',45000,'Almuerzo','Otros']]),
      catsG: ['Cr. Hip 1604','Crédito 40M','Libre inversión','Libre inversión mamá','Tarjeta de crédito','Prepagada','Moto','Otros'], catsI: ['Sueldo','Otros ingresos'], saldo0: { valor: 242014, mes: '2026-10' }, ingresoRef: 7832733,
      prev: {'Cr. Hip 1604':1700000,'Libre inversión':700000,'Libre inversión mamá':200000,'Tarjeta de crédito':1500000,'Prepagada':304815} }
  };
  const own = () => P[yo];
  const cp = o => JSON.parse(JSON.stringify(o));
  return {
    getDatos: () => Object.assign(cp(own()), { yo, perfiles: cp(P), hoy: '2026-10-15' }),
    ping: () => ({ yo, nombre: own().nombre }),
    guardarMovimiento: m => { const n = { ...m, id: Math.max(0, ...own().movs.map(x => x.id)) + 1, fecha: '2026-10-15', valor: Math.round(m.valor) }; own().movs.push(n); return cp(n); },
    editarMovimiento: (id, c) => { const x = own().movs.find(y => y.id === id); Object.assign(x, c); return cp(x); },
    borrarMovimiento: id => { own().movs = own().movs.filter(y => y.id !== id); return true; }
  };
})();

/* ===== Estado ===== */
const C = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESC = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
let ALL = null;   // respuesta completa de getDatos: { yo, perfiles:{carlos,valentina}, hoy, ... }
let D = null;     // datos de la vista activa (Hogar, Carlos o Valentina)
const PERF = ['carlos', 'valentina'];
const S = { tab: 'resumen', vista: '', period: '', showAll: false, detail: null, mvFilter: 'T', mvCat: '', budgetMes: '', saving: false,
  f: { tipo: 'G', monto: '', desc: '', cat: '', mes: '' } };
const curMes = () => D.hoy.slice(0, 7);

/* ===== Utilidades ===== */
const data = () => D.movs;
const months = () => { const s = new Set(data().map(x => x.mes)); s.add(curMes()); return [...s].filter(Boolean).sort(); };
const inP = (x, p) => p === 'all' || x.mes === p;
const sum = (arr, t) => arr.filter(x => x.tipo === t).reduce((a, b) => a + b.valor, 0);
function prevKey(k) { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function nextKey(k) { const [y, m] = k.split('-').map(Number); const d = new Date(y, m, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
const mName = (k, short) => { const [y, m] = k.split('-'); return (short ? MESC : MES)[+m - 1] + ' ' + y; };
const mShort = k => MESC[+k.split('-')[1] - 1];
const fmt = v => (v < 0 ? '−' : '') + '$' + Math.round(Math.abs(v)).toLocaleString('es-CO');
function fs(v) { const a = Math.abs(v), s = v < 0 ? '−' : ''; if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(2).replace('.', ',') + 'M'; if (a >= 1e3) return s + '$' + Math.round(a / 1e3) + 'k'; return s + '$' + Math.round(a); }
const fdate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return m + '/' + d + '/' + y; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const totalPrev = () => Object.values(D.prev).reduce((a, b) => a + b, 0);

function byCat(arr) {
  const g = arr.filter(x => x.tipo === 'G'), tot = g.reduce((a, b) => a + b.valor, 0), m = {};
  g.forEach(x => m[x.cat] = (m[x.cat] || 0) + x.valor);
  return Object.entries(m).map(([cat, val]) => ({ cat, val, pct: tot ? val / tot * 100 : 0 })).sort((a, b) => b.val - a.val);
}
function catAvg(cat, exclude) {
  const ms = months().filter(k => k !== exclude && k !== curMes());
  if (ms.length < 2) return null;
  return ms.reduce((a, k) => a + data().filter(x => x.mes === k && x.tipo === 'G' && x.cat === cat).reduce((s, x) => s + x.valor, 0), 0) / ms.length;
}
/* Saldo de una persona al cierre del mes k (null si k es anterior a su saldo inicial) */
function saldoPerfil(p, k) {
  if (!p || !p.saldo0 || !p.saldo0.mes || k < p.saldo0.mes) return null;
  return p.saldo0.valor + p.movs.filter(x => x.mes >= p.saldo0.mes && x.mes <= k).reduce((a, x) => a + (x.tipo === 'I' ? x.valor : -x.valor), 0);
}
/* En Hogar suma lo que exista de cada persona a ese mes */
function saldoFinal(k) {
  const vals = D.quienes.map(w => saldoPerfil(ALL.perfiles[w], k)).filter(v => v !== null);
  return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
}

/* ===== Perfiles y vistas ===== */
const disponibles = () => PERF.filter(k => ALL.perfiles[k]);
const nombre = k => k === 'hogar' ? 'Hogar' : (ALL.perfiles[k] && ALL.perfiles[k].nombre) || (k[0].toUpperCase() + k.slice(1));
const propio = () => ALL.perfiles[ALL.yo];
function vistaData(v) {
  const ks = v === 'hogar' ? disponibles() : [v];
  const uniq = a => [...new Set(a)], prev = {};
  ks.forEach(k => Object.entries(ALL.perfiles[k].prev || {}).forEach(([c, x]) => prev[c] = (prev[c] || 0) + x));
  return {
    vista: v, quienes: ks, ro: v !== ALL.yo, hoy: ALL.hoy, prev,
    movs: ks.flatMap(k => ALL.perfiles[k].movs.map(m => ({ ...m, who: k }))),
    catsG: uniq(ks.flatMap(k => ALL.perfiles[k].catsG)),
    catsI: uniq(ks.flatMap(k => ALL.perfiles[k].catsI))
  };
}
function setVista(v) { S.vista = v; D = vistaData(v); S.mvCat = ''; S.detail = null; S.showAll = false; if (S.period !== 'all' && !months().includes(S.period)) S.period = curMes(); }
function vistaSel() {
  const ks = disponibles();
  if (ks.length < 2) return '';
  return `<div class="seg vsel" style="margin-bottom:12px">${['hogar', ...ks].map(k => `<button class="${S.vista === k ? 'on' : ''}" data-vista="${k}">${nombre(k)}${k === ALL.yo ? ' <span class="yo">·tú</span>' : ''}</button>`).join('')}</div>`;
}
const roTag = () => D.ro ? '<span class="tag" style="margin-left:6px;vertical-align:middle">Solo lectura</span>' : '';

/* ===== Gráficos ===== */
function ring(pct) {
  const r = 26, C = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct));
  return `<div style="position:relative;width:64px;height:64px;flex:none"><svg width="64" height="64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" stroke-dasharray="${p / 100 * C} ${C}" transform="rotate(-90 32 32)"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1"><b style="font-size:13px">${Math.round(pct)}%</b><span style="font-size:8px;color:var(--heroInk)">ahorro</span></div></div>`;
}
function barsMonths(sel) {
  const ms = months().slice(-6), W = 300, H = 110, pad = 4, bw = (W - pad * 2) / ms.length;
  const vals = ms.map(k => { const a = data().filter(x => x.mes === k); return [sum(a, 'I'), sum(a, 'G')]; });
  const max = Math.max(1, ...vals.flat()), b = Math.min(14, bw / 3.2);
  let s = `<svg viewBox="0 0 ${W} ${H + 20}" width="100%" style="display:block">`;
  ms.forEach((k, i) => {
    const x = pad + i * bw + bw / 2, [vi, vg] = vals[i], hi = vi / max * H, hg = vg / max * H, on = sel === k, op = sel === 'all' || on ? 1 : .45;
    s += `<g data-month="${k}" style="cursor:pointer"><rect x="${x - bw / 2}" y="0" width="${bw}" height="${H + 20}" fill="${on ? C('--selband') : 'transparent'}" rx="8"/>
    <rect x="${x - b - 1.5}" y="${H - hi}" width="${b}" height="${Math.max(hi, 1)}" rx="3" fill="${C('--ing')}" opacity="${op}"/>
    <rect x="${x + 1.5}" y="${H - hg}" width="${b}" height="${Math.max(hg, 1)}" rx="3" fill="${C('--gas')}" opacity="${op}"/>
    <text x="${x}" y="${H + 14}" font-size="10" text-anchor="middle" fill="${on ? C('--ink') : C('--dim')}" font-weight="${on ? 700 : 500}">${mShort(k)}</text></g>`;
  });
  return s + '</svg>';
}
function barsCat(cat) {
  const ms = months().slice(-6), W = 300, H = 90, bw = W / ms.length;
  const vals = ms.map(k => data().filter(x => x.mes === k && x.tipo === 'G' && x.cat === cat).reduce((a, b) => a + b.valor, 0));
  const max = Math.max(1, ...vals, D.prev[cat] || 0), avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  let s = `<svg viewBox="0 0 ${W} ${H + 34}" width="100%" style="display:block">`;
  ms.forEach((k, i) => { const x = i * bw + bw / 2, h = vals[i] / max * H;
    s += `<rect x="${x - 11}" y="${H - h + 12}" width="22" height="${Math.max(h, 1)}" rx="4" fill="${C('--acc')}"/><text x="${x}" y="${H - h + 8}" font-size="9" text-anchor="middle" fill="${C('--mute')}">${vals[i] ? fs(vals[i]) : ''}</text><text x="${x}" y="${H + 28}" font-size="10" text-anchor="middle" fill="${C('--dim')}">${mShort(k)}</text>`; });
  s += `<line x1="0" x2="${W}" y1="${H - avg / max * H + 12}" y2="${H - avg / max * H + 12}" stroke="${C('--warn')}" stroke-dasharray="4 4"/>`;
  if (D.prev[cat]) { const yp = H - D.prev[cat] / max * H + 12; s += `<line x1="0" x2="${W}" y1="${yp}" y2="${yp}" stroke="${C('--mute')}" stroke-opacity=".6"/>`; }
  return s + '</svg>';
}

/* ===== Pantallas ===== */
function periodChips(withAll) {
  return `<div class="chips">${withAll ? `<button class="chip ${S.period === 'all' ? 'on' : ''}" data-period="all">Histórico</button>` : ''}${months().slice().reverse().map(k => `<button class="chip ${S.period === k ? 'on' : ''}" data-period="${k}">${mName(k, true)}</button>`).join('')}</div>`;
}

/* Hogar: comparación entre las dos personas para el periodo elegido */
function porPersona(cur, gasTot, k) {
  if (D.vista !== 'hogar' || D.quienes.length < 2) return '';
  return `<div class="t s2"><div class="row" style="margin-bottom:4px"><span class="lbl">Por persona</span><span style="font-size:10px;color:var(--dim)">disponible · ing · gas</span></div>
  ${D.quienes.map(w => { const a = cur.filter(x => x.who === w), i = sum(a, 'I'), g = sum(a, 'G'), sp = saldoPerfil(ALL.perfiles[w], k), pc = gasTot ? g / gasTot * 100 : 0;
    return `<div class="rk" data-vista="${w}"><span class="n">${esc(nombre(w))}${w === ALL.yo ? ' <span class="yo">·tú</span>' : ''}</span><span class="p">${sp === null ? '—' : fmt(sp)}</span><span class="bar"><i style="width:${pc}%"></i></span><span class="m"><span style="color:var(--ing)">+${fs(i)}</span> · <span style="color:var(--gas)">−${fs(g)}</span></span><span class="a" style="color:var(--dim)">${pc.toFixed(0)}% del gasto</span></div>`; }).join('')}
  </div>`;
}

function vResumen() {
  const p = S.period, d = data(), cur = d.filter(x => inP(x, p)), cm = curMes();
  const ing = sum(cur, 'I'), gas = sum(cur, 'G'), bal = ing - gas, ah = ing ? bal / ing * 100 : 0;
  // En Hogar no se compara con un mes en el que alguno aún no registraba
  const nuevo = p === 'all' ? [] : D.quienes.filter(w => { const m = ALL.perfiles[w].saldo0 && ALL.perfiles[w].saldo0.mes; return D.quienes.length > 1 && m && m > prevKey(p) && m <= p; });
  const sinCmp = nuevo.length ? `<div class="sub">${esc(nuevo.map(nombre).join(' y '))} empezó en ${mShort(p).toLowerCase()}</div>` : '';
  let cmp = '';
  if (p !== 'all' && !nuevo.length) { const pv = d.filter(x => x.mes === prevKey(p)); if (pv.length) { const dl = bal - (sum(pv, 'I') - sum(pv, 'G')); cmp = `${dl >= 0 ? '+' : '−'}${fs(Math.abs(dl))} vs ${mShort(prevKey(p)).toLowerCase()}`; } }
  const delta = t => {
    if (p === 'all') return '';
    if (sinCmp && !(t === 'I' && p === cm && !sum(cur, t))) return sinCmp;
    const pv = d.filter(x => x.mes === prevKey(p)); const a = sum(cur, t), b = sum(pv, t);
    if (!a && t === 'I' && p === cm) return '<div class="sub">Aún sin registrar</div>';
    if (!pv.length) return '<div class="sub">Sin mes anterior</div>';
    if (!b) return '';
    const c = (a - b) / b * 100, bad = t === 'G' ? c > 0 : c < 0;
    return `<div class="sub ${bad ? 'up' : 'down'}">${c >= 0 ? '▲' : '▼'} ${Math.abs(c).toFixed(0)}% vs mes ant.</div>`;
  };
  const rk = byCat(cur), shown = S.showAll ? rk : rk.slice(0, 5);
  const top = cur.filter(x => x.tipo === 'G').sort((a, b) => b.valor - a.valor)[0];
  let days;
  if (p === 'all') days = Math.max(1, months().length * 30);
  else { const [y, m] = p.split('-').map(Number); days = p === cm ? +D.hoy.slice(8) : new Date(y, m, 0).getDate(); }
  const tp = totalPrev(), ejec = tp ? gas / tp * 100 : 0, colE = ejec > 100 ? 'var(--gas)' : ejec > 80 ? 'var(--warn)' : 'var(--ing)';
  const isNow = p === 'all' || p === cm, k = p === 'all' ? cm : p, sf = saldoFinal(isNow ? months().slice(-1)[0] : k), pend = p === cm && ing === 0;
  const kk = isNow ? months().slice(-1)[0] : k;
  const heroSub = sf === null ? 'Antes del saldo inicial registrado' : !isNow ? 'Pasa como saldo inicial a ' + mShort(nextKey(k)).toLowerCase() : D.vista === 'hogar' ? 'Suma de las cuentas de ' + D.quienes.map(nombre).join(' y ') : D.ro ? 'Cuenta de ' + nombre(D.vista) : 'Debe coincidir con tu cuenta bancaria';
  return `
  <div class="row" style="margin-bottom:12px"><div><div class="lbl">Resumen · ${nombre(D.vista)}${roTag()}</div><div style="font-size:20px;font-weight:700;margin-top:2px">${p === 'all' ? 'Histórico' : mName(p)}</div></div>
  <button class="iconbtn" data-act="refresh" title="Actualizar">↻</button></div>
  ${vistaSel()}${periodChips(true)}
  <div class="grid" style="margin-top:12px">
    <div class="t s2" style="background:linear-gradient(135deg,var(--heroA),var(--heroB));color:#fff">
      <div class="lbl" style="color:var(--heroInk)">${isNow ? 'Disponible hoy' : 'Saldo final de ' + mShort(k).toLowerCase()}</div>
      <div class="big">${sf === null ? '—' : fmt(sf)}</div>
      <div class="sub" style="color:var(--heroInk);margin-bottom:12px">${heroSub}</div>
      <div class="row" style="border-top:1px solid rgba(165,243,252,.2);padding-top:10px">
        <div><div class="lbl" style="color:var(--heroInk)">${p === 'all' ? 'Resultado acumulado' : 'Resultado del mes'}</div>
        <div class="mid" style="color:${bal >= 0 ? 'var(--heroPos)' : 'var(--heroNeg)'}">${bal >= 0 ? '+' : ''}${fs(bal)}</div>
        <div class="sub" style="color:var(--heroInk)">${pend ? '⏳ Sueldos pendientes' : (cmp || (p === 'all' ? months().length + ' meses registrados' : 'Ingresos − gastos'))}</div></div>
        ${pend ? '' : ring(ah)}</div></div>
    <div class="t"><div class="lbl">Ingresos</div><div class="mid" style="color:var(--ing)">${fs(ing)}</div>${delta('I')}</div>
    <div class="t"><div class="lbl">Gastos</div><div class="mid" style="color:var(--gas)">${fs(gas)}</div>${delta('G')}</div>
    ${porPersona(cur, gas, kk)}
    <div class="t s2"><div class="row"><span class="lbl">Ingresos vs gastos</span><span style="font-size:10px;color:var(--dim)"><span style="color:var(--ing)">●</span> Ing <span style="color:var(--gas)">●</span> Gas</span></div><div style="margin-top:8px">${barsMonths(p)}</div><div class="sub" style="text-align:center;margin-top:2px">Toca un mes para verlo</div></div>
    <div class="t s2"><div class="row" style="margin-bottom:4px"><span class="lbl">¿En qué se va la plata?</span><span class="tag">${rk.length} categorías</span></div>
      ${rk.length ? shown.map(r => { const avg = catAvg(r.cat, p); let a = '';
        if (p !== 'all' && avg) { const c = (r.val - avg) / avg * 100; a = `<span class="${c > 0 ? 'up' : 'down'}">${c > 0 ? '▲' : '▼'} ${Math.abs(c).toFixed(0)}% vs prom.</span>`; }
        return `<div class="rk" data-cat="${esc(r.cat)}"><span class="n">${esc(r.cat)}</span><span class="p">${r.pct.toFixed(1).replace('.', ',')}%</span><span class="bar"><i style="width:${r.pct}%"></i></span><span class="m">${fmt(r.val)}</span><span class="a">${a}</span></div>`; }).join('') : '<div class="empty">Sin gastos en este periodo</div>'}
      ${rk.length > 5 ? `<button class="link" data-act="all">${S.showAll ? 'Ver menos' : 'Ver todas (' + rk.length + ')'}</button>` : ''}
    </div>
    <div class="t"><div class="lbl">Gasto diario</div><div class="mid">${fs(gas / days)}</div><div class="sub">promedio${p === cm ? ' (mes en curso)' : ''}</div></div>
    <div class="t"><div class="lbl">Mayor gasto</div><div class="mid">${top ? fs(top.valor) : '—'}</div><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${top ? esc(top.desc || top.cat) : ''}</div></div>
    ${p !== 'all' && tp ? `<div class="t s2" data-go="presupuesto" style="cursor:pointer"><div class="row"><span class="lbl">Presupuesto del mes</span><span style="font-size:12px;font-weight:700;color:${colE}">${ejec.toFixed(0)}%</span></div><div class="pb"><i style="width:${Math.min(ejec, 100)}%;background:${colE}"></i></div><div class="sub">${fmt(gas)} de ${fmt(tp)} previsto · ver detalle ›</div></div>` : ''}
  </div>`;
}

function mvRow(x) {
  const who = D.vista === 'hogar' ? `<span class="who who-${x.who}">${esc(nombre(x.who))}</span> ` : '';
  return `<div class="mv${D.ro ? ' ro' : ''}" ${D.ro ? '' : `data-edit="${x.id}"`}><div style="min-width:0"><div class="d">${esc(x.desc || x.cat)}</div><div class="c">${who}${esc(x.cat)} · ${fdate(x.fecha)}${x.mes !== x.fecha.slice(0, 7) ? ` · <span style="color:var(--warn)">cuenta en ${mShort(x.mes)}</span>` : ''}</div></div><div class="v" style="color:${x.tipo === 'I' ? 'var(--ing)' : 'var(--ink)'}">${x.tipo === 'I' ? '+' : '−'}${fmt(x.valor)}</div></div>`;
}

function vDetalle() {
  const cat = S.detail, p = S.period, d = data();
  const cur = d.filter(x => inP(x, p) && x.tipo === 'G'), tot = cur.reduce((a, b) => a + b.valor, 0);
  const items = cur.filter(x => x.cat === cat).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const val = items.reduce((a, b) => a + b.valor, 0), ms = months();
  const avg = ms.reduce((a, k) => a + d.filter(x => x.mes === k && x.tipo === 'G' && x.cat === cat).reduce((s, x) => s + x.valor, 0), 0) / ms.length;
  return `<button class="back" data-act="back">‹ Resumen</button>
  <div class="lbl">${p === 'all' ? 'Histórico' : mName(p)}</div>
  <div style="font-size:24px;font-weight:800;margin:2px 0 12px">${esc(cat)}</div>
  <div class="grid">
    <div class="t"><div class="lbl">Total</div><div class="mid">${fs(val)}</div><div class="sub">${tot ? (val / tot * 100).toFixed(1).replace('.', ',') : 0}% de los gastos</div></div>
    <div class="t"><div class="lbl">Prom. mensual</div><div class="mid">${fs(avg)}</div><div class="sub">${D.prev[cat] ? 'Previsto ' + fs(D.prev[cat]) : 'Sin previsto'}</div></div>
    <div class="t s2"><div class="row"><span class="lbl">Por mes</span><span style="font-size:10px;color:var(--dim)"><span style="color:var(--warn)">- -</span> promedio ${D.prev[cat] ? '<span style="color:var(--mute)">—</span> previsto' : ''}</span></div><div style="margin-top:6px">${barsCat(cat)}</div></div>
  </div>
  <div class="dayh">${items.length} movimientos</div>
  ${items.map(mvRow).join('') || '<div class="empty">Sin movimientos</div>'}`;
}

function vMovs() {
  const p = S.period;
  const d = data().filter(x => inP(x, p)).filter(x => S.mvFilter === 'T' || x.tipo === S.mvFilter).filter(x => !S.mvCat || x.cat === S.mvCat).sort((a, b) => b.fecha.localeCompare(a.fecha) || (a.who === b.who ? b.id - a.id : a.who.localeCompare(b.who)));
  const cats = [...new Set(data().filter(x => inP(x, p)).map(x => x.cat))].sort();
  let html = `<div class="row"><div><div class="lbl">Movimientos · ${nombre(D.vista)}${roTag()}</div><div style="font-size:20px;font-weight:700;margin:2px 0 12px">${p === 'all' ? 'Histórico' : mName(p)}</div></div><button class="iconbtn" data-act="refresh" title="Actualizar">↻</button></div>${vistaSel()}${periodChips(true)}
  <div class="seg" style="margin:12px 0 8px">${[['T', 'Todos'], ['G', 'Gastos'], ['I', 'Ingresos']].map(([k, l]) => `<button class="${S.mvFilter === k ? 'on' : ''}" data-mvf="${k}">${l}</button>`).join('')}</div>
  <div class="chips"><button class="chip ${!S.mvCat ? 'on' : ''}" data-mvc="">Todas</button>${cats.map(c => `<button class="chip ${S.mvCat === c ? 'on' : ''}" data-mvc="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  let last = '';
  d.forEach(x => { if (x.fecha !== last) { last = x.fecha; const day = d.filter(y => y.fecha === x.fecha && y.tipo === 'G').reduce((a, b) => a + b.valor, 0); html += `<div class="dayh row"><span>${fdate(x.fecha)}</span><span>${day ? '−' + fmt(day) : ''}</span></div>`; } html += mvRow(x); });
  if (!d.length) html += '<div class="empty">No hay movimientos con este filtro</div>';
  return html + `<div class="sub" style="text-align:center;margin-top:14px">${D.ro ? 'Solo lectura. Para registrar o editar, cambia a tu perfil (' + esc(nombre(ALL.yo)) + ').' : 'Toca un movimiento para editarlo o borrarlo'}</div>`;
}

function vPresupuesto() {
  const ms = months().slice().reverse(); if (!ms.includes(S.budgetMes)) S.budgetMes = ms[0];
  const k = S.budgetMes, cur = data().filter(x => x.mes === k && x.tipo === 'G'), real = {};
  cur.forEach(x => real[x.cat] = (real[x.cat] || 0) + x.valor);
  const cats = [...new Set([...Object.keys(D.prev), ...Object.keys(real)])];
  const tp = totalPrev(), tr = cur.reduce((a, b) => a + b.valor, 0), pt = tp ? tr / tp * 100 : 0;
  const rows = cats.map(c => ({ c, p: D.prev[c] || 0, r: real[c] || 0 })).sort((a, b) => (b.p ? b.r / b.p : 9) - (a.p ? a.r / a.p : 9));
  const col = x => x > 100 ? 'var(--gas)' : x > 80 ? 'var(--warn)' : 'var(--ing)';
  const hojas = { carlos: 'Carlos 2026', valentina: 'Valentina 2026' };
  return `<div class="lbl">Presupuesto · ${nombre(D.vista)}${roTag()}</div><div style="font-size:20px;font-weight:700;margin:2px 0 12px">${mName(k)}</div>
  ${vistaSel()}<div class="chips">${ms.map(m => `<button class="chip ${k === m ? 'on' : ''}" data-bmes="${m}">${mName(m, true)}</button>`).join('')}</div>
  <div class="t" style="margin:12px 0"><div class="row"><span class="lbl">Ejecutado</span><b style="color:${col(pt)}">${pt.toFixed(0)}%</b></div><div class="pb"><i style="width:${Math.min(pt, 100)}%;background:${col(pt)}"></i></div><div class="row sub" style="margin-top:6px"><span>${fmt(tr)} gastado</span><span>${fmt(tp)} previsto</span></div><div class="sub" style="margin-top:4px">Disponible: <b style="color:var(--ink)">${fmt(tp - tr)}</b></div></div>
  ${rows.map(x => { const pc = x.p ? x.r / x.p * 100 : null; return `<div style="padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer" data-cat="${esc(x.c)}"><div class="row" style="font-size:13px"><span style="font-weight:500">${esc(x.c)}</span><span>${pc === null ? '<span class="tag">sin previsto</span>' : `<b style="color:${col(pc)}">${pc.toFixed(0)}%</b>`}</span></div><div class="pb" style="height:6px"><i style="width:${pc === null ? 100 : Math.min(pc, 100)}%;background:${pc === null ? 'var(--faint)' : col(pc)}"></i></div><div class="row" style="font-size:11px;color:var(--dim);margin-top:4px"><span>${fmt(x.r)}</span><span>${x.p ? 'de ' + fmt(x.p) : ''}</span></div></div>`; }).join('')}
  <div class="sub" style="margin-top:12px">Los valores previstos vienen de la columna “Previsto” de ${D.quienes.length > 1 ? 'las hojas ' + D.quienes.map(w => hojas[w] || nombre(w)).join(' y ') : 'la hoja ' + (hojas[D.quienes[0]] || nombre(D.quienes[0]))}.</div>`;
}

function vCargar() {
  const f = S.f, own = propio(), cats = f.tipo === 'G' ? own.catsG : own.catsI, cm = curMes();
  return `<div class="row"><span class="lbl">Nuevo movimiento · ${esc(own.nombre || nombre(ALL.yo))}</span><div style="display:flex;gap:8px"><button class="iconbtn" data-act="config" title="Configuración">⚙</button><button class="iconbtn" data-act="refresh" title="Actualizar">↻</button></div></div>
  <div class="seg" style="margin-top:12px">${[['G', 'Gasto'], ['I', 'Ingreso']].map(([k, l]) => `<button class="${f.tipo === k ? 'on' : ''}" data-tipo="${k}" style="${f.tipo === k ? `color:${k === 'G' ? 'var(--gas)' : 'var(--ing)'}` : ''}">${l}</button>`).join('')}</div>
  <div class="field"><div class="lbl">Monto</div><input class="amount" id="monto" inputmode="numeric" autocomplete="off" placeholder="0" value="${f.monto ? Number(f.monto).toLocaleString('es-CO') : ''}"></div>
  <div class="field"><div class="lbl">Detalle</div><input class="txt" id="desc" autocomplete="off" placeholder="Opcional" value="${esc(f.desc)}"></div>
  <div class="field"><div class="row"><span class="lbl">Fecha</span><span style="font-size:13px;color:var(--mute)">${fdate(D.hoy)} · hoy</span></div>
    <div class="row" style="margin-top:10px"><span class="lbl">Cuenta en el mes</span><div class="chips">${[prevKey(cm), cm, nextKey(cm)].map(m => `<button class="chip ${f.mes === m ? 'on' : ''}" data-fmes="${m}">${mName(m, true)}</button>`).join('')}</div></div></div>
  <div class="lbl" style="margin-top:16px">Categoría</div>
  <div class="cats">${cats.map(c => `<button class="cat ${f.cat === c ? 'on' : ''}" data-fcat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div style="height:60px"></div>`;
}

/* ===== Render ===== */
const ICONS = { resumen: '<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>', cargar: '<path d="M12 5v14M5 12h14"/>', movimientos: '<path d="M4 6h16M4 12h16M4 18h10"/>', presupuesto: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 5"/>' };
function render() {
  const main = document.getElementById('main');
  main.innerHTML = { cargar: vCargar, resumen: S.detail ? vDetalle : vResumen, movimientos: vMovs, presupuesto: vPresupuesto }[S.tab]();
  document.getElementById('nav').innerHTML = Object.keys(ICONS).map(k => `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${k === 'movimientos' ? 'Movim.' : k}</button>`).join('');
  document.getElementById('extra').innerHTML = S.tab === 'cargar' ? `<button class="save" id="save" ${ok() && !S.saving ? '' : 'disabled'}>${S.saving ? 'Guardando…' : 'Guardar ' + (S.f.tipo === 'G' ? 'gasto' : 'ingreso')}</button>` : '';
  const m = document.getElementById('monto');
  if (m) m.oninput = e => { const n = e.target.value.replace(/\D/g, ''); S.f.monto = n; e.target.value = n ? Number(n).toLocaleString('es-CO') : ''; upd(); };
  const ds = document.getElementById('desc'); if (ds) ds.oninput = e => S.f.desc = e.target.value;
  const sv = document.getElementById('save'); if (sv) sv.onclick = save;
}
const ok = () => S.f.monto > 0 && S.f.cat && S.f.mes;
function upd() { const sv = document.getElementById('save'); if (sv) sv.disabled = !ok() || S.saving; }
function toast(t, err) { const el = document.getElementById('toast'); el.textContent = t; el.style.background = err ? 'var(--toastErr)' : 'var(--toastBg)'; el.style.color = err ? '#fff' : 'var(--toastInk)'; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), err ? 4000 : 2400); }

async function save() {
  if (!ok() || S.saving) return;
  const f = S.f; S.saving = true; upd(); document.getElementById('save').textContent = 'Guardando…';
  try {
    const m = await api('guardarMovimiento', { tipo: f.tipo, valor: +f.monto, desc: f.desc.trim(), cat: f.cat, mes: f.mes });
    propio().movs.push(m); D = vistaData(S.vista);
    toast(`✓ ${f.tipo === 'G' ? 'Gasto' : 'Ingreso'} de ${fmt(m.valor)} guardado en ${mName(m.mes, true)}`);
    S.f = { tipo: f.tipo, monto: '', desc: '', cat: '', mes: curMes() };
  } catch (e) { toast('No se guardó: ' + e, true); }
  S.saving = false; if (S.tab === 'cargar') render();
}

function editSheet(id) {
  if (D.ro) return;
  const x = propio().movs.find(y => y.id === id); if (!x) return;
  const cats = x.tipo === 'G' ? D.catsG : D.catsI, ms = [...new Set([...months(), nextKey(curMes()), x.mes])].sort();
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="sheet"><div class="row"><b style="font-size:16px">Editar ${x.tipo === 'G' ? 'gasto' : 'ingreso'}</b><span class="sub">${fdate(x.fecha)}</span></div>
  <label>Monto</label><input id="e_v" inputmode="numeric" value="${x.valor.toLocaleString('es-CO')}">
  <label>Detalle</label><input id="e_d" value="${esc(x.desc)}">
  <div class="grid"><div><label>Categoría</label><select id="e_c">${[...new Set([...cats, x.cat])].map(c => `<option ${c === x.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
  <div><label>Cuenta en</label><select id="e_m">${ms.map(m => `<option value="${m}" ${m === x.mes ? 'selected' : ''}>${mName(m, true)}</option>`).join('')}</select></div></div>
  <div class="btns"><button class="del" id="e_del">Borrar</button><button class="ok" id="e_ok">Guardar</button></div></div>`;
  document.getElementById('phone').appendChild(ov);
  const busy = on => ov.querySelectorAll('button').forEach(b => b.disabled = on);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.querySelector('#e_v').oninput = e => { const n = e.target.value.replace(/\D/g, ''); e.target.value = n ? Number(n).toLocaleString('es-CO') : ''; };
  const del = ov.querySelector('#e_del');
  del.onclick = async () => {
    if (!del.dataset.sure) { del.dataset.sure = 1; del.textContent = '¿Seguro? Toca otra vez'; return; }
    busy(true); del.textContent = 'Borrando…';
    try { await api('borrarMovimiento', id); propio().movs = propio().movs.filter(y => y.id !== id); D = vistaData(S.vista); ov.remove(); toast('Registro borrado'); render(); }
    catch (e) { busy(false); del.textContent = 'Borrar'; delete del.dataset.sure; toast('No se borró: ' + e, true); }
  };
  ov.querySelector('#e_ok').onclick = async () => {
    const c = { valor: +ov.querySelector('#e_v').value.replace(/\D/g, ''), desc: ov.querySelector('#e_d').value, cat: ov.querySelector('#e_c').value, mes: ov.querySelector('#e_m').value };
    if (!(c.valor > 0)) { toast('El monto debe ser mayor que cero', true); return; }
    busy(true); ov.querySelector('#e_ok').textContent = 'Guardando…';
    try { const m = await api('editarMovimiento', id, c); propio().movs = propio().movs.map(y => y.id === id ? m : y); D = vistaData(S.vista); ov.remove(); toast('✓ Cambios guardados'); render(); }
    catch (e) { busy(false); ov.querySelector('#e_ok').textContent = 'Guardar'; toast('No se guardó: ' + e, true); }
  };
}

async function cargar(silencioso) {
  if (!DEMO && !getCfg()) return vSetup();
  if (!silencioso) { document.getElementById('nav').innerHTML = ''; document.getElementById('extra').innerHTML = ''; document.getElementById('main').innerHTML = '<div class="empty" style="padding-top:45vh">Cargando…</div>'; }
  try {
    const r = await api('getDatos');
    if (!r.perfiles) { r.yo = r.yo || 'carlos'; r.perfiles = { [r.yo]: { nombre: r.nombre || 'Carlos', movs: r.movs, catsG: r.catsG, catsI: r.catsI, saldo0: r.saldo0, prev: r.prev } }; } // API anterior
    ALL = r;
    if (!S.vista || (S.vista !== 'hogar' && !ALL.perfiles[S.vista]) || (S.vista === 'hogar' && disponibles().length < 2)) S.vista = ALL.yo;
    D = vistaData(S.vista);
    if (!S.period) S.period = curMes();
    if (!S.f.mes) S.f.mes = curMes();
    if (!S.budgetMes) S.budgetMes = curMes();
    render();
    if (silencioso) toast('✓ Datos actualizados');
  } catch (e) {
    if (e === 'PIN incorrecto' || e === 'SIN_CONFIG') return vSetup(e === 'PIN incorrecto' ? 'La contraseña guardada ya no es válida.' : '');
    if (silencioso) return toast(String(e), true);
    document.getElementById('main').innerHTML = `<div class="empty" style="padding-top:38vh">No pude leer el Sheet:<br>${esc(e)}<br><br><button class="chip on" data-act="retry">Reintentar</button> <button class="chip" data-act="config">Configuración</button></div>`;
  }
}

/* ===== Face ID: bloqueo local con passkey (WebAuthn) =====
   Opcional por teléfono (⚙ → Ajustes). Se pide al abrir la app y al volver tras 5 min en segundo plano.
   Es un bloqueo de pantalla local: la API sigue protegida por la contraseña. Respaldo: la contraseña guardada. */
const FID_KEY = 'gastos_faceid', BG_KEY = 'gastos_bg', FID_MIN = 5;
function getFid() { try { return JSON.parse(localStorage.getItem(FID_KEY) || 'null'); } catch (e) { return null; } }
function setFid(v) { try { v ? localStorage.setItem(FID_KEY, JSON.stringify(v)) : localStorage.removeItem(FID_KEY); } catch (e) {} }
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function fidDisponible() {
  try { return !!(window.PublicKeyCredential && navigator.credentials && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
}
let fidCtl = null;
async function fidVerificar(id) {
  if (fidCtl) { try { fidCtl.abort(); } catch (e) {} } // cancela una solicitud anterior que quedó colgada
  const ctl = fidCtl = new AbortController();
  const limite = setTimeout(() => ctl.abort(), 30000);
  try {
    await navigator.credentials.get({ signal: ctl.signal, publicKey: { challenge: rnd(32), rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: unb64u(id), transports: ['internal'] }], userVerification: 'required', timeout: 30000 } });
  } finally { clearTimeout(limite); if (fidCtl === ctl) fidCtl = null; }
}
async function fidActivar() {
  const f = getFid();
  if (f && f.id) { await fidVerificar(f.id); setFid({ id: f.id, on: true }); return; } // reutiliza la passkey ya creada
  const yo = ALL ? ALL.yo : 'gastos';
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: rnd(32), rp: { name: 'Gastos', id: location.hostname },
    user: { id: rnd(16), name: 'gastos-' + yo, displayName: 'Gastos · ' + (ALL ? nombre(yo) : '') },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
    timeout: 60000, attestation: 'none' } });
  setFid({ id: b64u(cred.rawId), on: true });
}
const fidActivo = () => { const f = getFid(); return !!(f && f.on && f.id && (getCfg() || DEMO)); };
const fidMotivo = e => e && e.name === 'NotAllowedError' ? 'Se canceló o no se reconoció.' : e && e.name === 'InvalidStateError' ? 'Ya existe una llave para este teléfono.' : 'Face ID no está disponible en este momento.';
function marcarSalida() { try { localStorage.setItem(BG_KEY, String(Date.now())); } catch (e) {} }

let bloqueada = false, fallosLocal = 0, esperaHasta = 0;
function bloquear() {
  if (bloqueada || !fidActivo()) return;
  bloqueada = true;
  const el = document.createElement('div'); el.className = 'lock'; el.id = 'lock';
  el.innerHTML = `<img src="icon-192.png" width="72" height="72" style="border-radius:17px" alt="">
    <h2>Gastos bloqueado</h2><p>Toca el botón para entrar con Face ID.</p>
    <button class="ok" id="l_fid">Desbloquear con Face ID</button>
    <button class="link" id="l_pw" style="margin-top:14px">Usar contraseña</button>
    <div id="l_box" style="width:100%" hidden><input id="l_pin" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Contraseña"><button class="ok" id="l_ok" style="margin-top:12px">Entrar</button></div>
    <div class="err" id="l_err"></div>`;
  document.getElementById('phone').appendChild(el);
  const err = el.querySelector('#l_err'), box = el.querySelector('#l_box'), pin = el.querySelector('#l_pin');
  const btn = el.querySelector('#l_fid');
  const intentar = async () => {
    err.textContent = ''; btn.textContent = 'Esperando Face ID…';
    try { await fidVerificar(getFid().id); desbloquear(); }
    catch (e) {
      if (fidCtl || !document.getElementById('lock')) return; // hay un intento más nuevo en curso, o ya se desbloqueó
      btn.textContent = 'Desbloquear con Face ID';
      err.textContent = (e && e.name === 'AbortError' ? 'Face ID no respondió.' : fidMotivo(e)) + ' Toca el botón de nuevo o usa tu contraseña.' + (e && e.name ? ' (' + e.name + ')' : '');
    }
  };
  const conPin = () => {
    if (Date.now() < esperaHasta) { err.textContent = 'Demasiados intentos. Espera unos segundos.'; return; }
    const real = DEMO ? 'demo' : (getCfg() || {}).pin;
    if (pin.value && pin.value === real) { fallosLocal = 0; return desbloquear(); }
    pin.value = ''; fallosLocal++;
    if (fallosLocal >= 5) { esperaHasta = Date.now() + 30000; fallosLocal = 0; err.textContent = 'Demasiados intentos. Espera 30 segundos.'; }
    else err.textContent = 'Contraseña incorrecta';
  };
  btn.onclick = intentar;
  el.querySelector('#l_pw').onclick = () => { box.hidden = false; pin.focus(); };
  el.querySelector('#l_ok').onclick = conPin;
  pin.onkeydown = e => { if (e.key === 'Enter') conPin(); };
}
function desbloquear() { if (fidCtl) { try { fidCtl.abort(); } catch (e) {} } bloqueada = false; const el = document.getElementById('lock'); if (el) el.remove(); marcarSalida(); }
function revisarBloqueo() {
  if (bloqueada || !fidActivo()) return;
  let t = 0; try { t = Number(localStorage.getItem(BG_KEY)) || 0; } catch (e) {}
  if (Date.now() - t > FID_MIN * 60000) bloquear();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (!bloqueada) marcarSalida(); } else revisarBloqueo(); });
window.addEventListener('pageshow', e => { if (e.persisted) revisarBloqueo(); });

async function ajustes() {
  const disp = await fidDisponible(), on = fidActivo();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ajustes';
  ov.innerHTML = `<div class="sheet"><div class="row"><b style="font-size:16px">Ajustes</b><span class="sub">${ALL ? 'Perfil: ' + esc(nombre(ALL.yo)) : ''}</span></div>
    <div class="opt"><div><div style="font-size:14px;font-weight:600">Bloqueo con Face ID</div>
      <div class="sub">${disp ? 'Se pide al abrir la app y al volver después de ' + FID_MIN + ' minutos. Si falla, entras con tu contraseña.' : 'Este teléfono no permite Face ID en esta app.'}</div></div>
      ${disp || on ? `<button class="sw ${on ? 'on' : ''}" id="a_fid" aria-label="Bloqueo con Face ID"></button>` : ''}</div>
    <div class="opt" style="border-bottom:0"><div><div style="font-size:14px;font-weight:600">Conexión</div><div class="sub">URL de Apps Script y contraseña de este teléfono</div></div><button class="chip" id="a_cfg">Cambiar</button></div>
    <div class="btns"><button class="ok" id="a_ok">Listo</button></div></div>`;
  document.getElementById('phone').appendChild(ov);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.querySelector('#a_ok').onclick = () => ov.remove();
  ov.querySelector('#a_cfg').onclick = () => { ov.remove(); vSetup(); };
  const sw = ov.querySelector('#a_fid');
  if (sw) sw.onclick = async () => {
    sw.disabled = true;
    if (fidActivo()) { const f = getFid(); setFid({ id: f.id, on: false }); sw.classList.remove('on'); toast('Face ID desactivado'); }
    else {
      try { await fidActivar(); sw.classList.add('on'); toast('✓ Face ID activado'); }
      catch (e) { toast('No se activó: ' + fidMotivo(e), true); }
    }
    sw.disabled = false;
  };
}

function vSetup(msg) {
  const c = getCfg() || {};
  D = null; ALL = null; S.vista = '';
  document.getElementById('nav').innerHTML = '';
  document.getElementById('extra').innerHTML = '';
  document.getElementById('main').innerHTML = `<div class="setup">
    <img src="icon-192.png" width="64" height="64" style="border-radius:15px" alt="">
    <h1>Conectar Gastos</h1>
    <p>Se guarda solo en este teléfono. Pega la URL de la implementación de Apps Script (termina en <b>/exec</b>) y tu contraseña.</p>
    <label>URL de Apps Script</label><input id="s_url" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(c.url || '')}">
    <label>Contraseña</label><input id="s_pin" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••••">
    <button class="ok" id="s_ok">Conectar</button>
    <div class="err" id="s_err">${esc(msg || '')}</div>
    ${getCfg() ? '<button class="link" id="s_out" style="margin-top:8px">Borrar configuración de este teléfono</button>' : ''}
  </div>`;
  const ok = document.getElementById('s_ok'), err = document.getElementById('s_err');
  ok.onclick = async () => {
    const url = document.getElementById('s_url').value.trim(), pin = document.getElementById('s_pin').value;
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) { err.textContent = 'La URL debe ser la de Apps Script y terminar en /exec.'; return; }
    if (!pin) { err.textContent = 'Escribe la contraseña.'; return; }
    ok.disabled = true; ok.textContent = 'Conectando…'; err.textContent = '';
    try { await callApi({ url, pin }, 'ping'); setCfg({ url, pin }); cargar(); }
    catch (e) { err.textContent = String(e); ok.disabled = false; ok.textContent = 'Conectar'; }
  };
  const out = document.getElementById('s_out');
  if (out) out.onclick = () => { setCfg(null); setFid(null); vSetup(); };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-period],[data-act],[data-cat],[data-month],[data-go],[data-mvf],[data-mvc],[data-edit],[data-bmes],[data-tipo],[data-fmes],[data-fcat],[data-vista]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.act === 'retry') return cargar();
  if (ds.act === 'config') return D ? ajustes() : vSetup();
  if (!D) return;
  if (ds.vista) { setVista(ds.vista); }
  else if (ds.tab) { S.tab = ds.tab; S.detail = null; }
  else if (ds.period) { S.period = ds.period; S.showAll = false; }
  else if (ds.month) { S.period = ds.month; }
  else if (ds.go) { S.tab = ds.go; if (S.period !== 'all') S.budgetMes = S.period; }
  else if (ds.cat !== undefined) { if (S.tab === 'presupuesto') S.period = S.budgetMes; S.tab = 'resumen'; S.detail = ds.cat; }
  else if (ds.act === 'back') { S.detail = null; }
  else if (ds.act === 'all') { S.showAll = !S.showAll; }
  else if (ds.act === 'refresh') { return cargar(true); }
  else if (ds.mvf) { S.mvFilter = ds.mvf; }
  else if (ds.mvc !== undefined) { S.mvCat = ds.mvc; }
  else if (ds.edit) { editSheet(+ds.edit); return; }
  else if (ds.bmes) { S.budgetMes = ds.bmes; }
  else if (ds.tipo) { S.f.tipo = ds.tipo; S.f.cat = ''; }
  else if (ds.fmes) { S.f.mes = ds.fmes; }
  else if (ds.fcat) { S.f.cat = ds.fcat; document.querySelectorAll('.cat').forEach(c => c.classList.toggle('on', c.dataset.fcat === ds.fcat)); upd(); return; }
  const keep = !!(ds.mvf || ds.mvc !== undefined || ds.act === 'all' || ds.fmes || ds.tipo);
  const main = document.getElementById('main'), sc = main.scrollTop;
  render(); main.scrollTop = keep ? sc : 0;
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (D) render(); }); } catch (e) {}
if (fidActivo()) bloquear();
cargar();
</script>
